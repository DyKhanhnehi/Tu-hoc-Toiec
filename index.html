<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bậc Thang TOEIC</title>
<meta name="description" content="Học tiếng Anh theo lộ trình TOEIC 6 bậc, từ cơ bản đến nâng cao. Có bài kiểm tra, đạt mới được lên bậc.">
<meta name="theme-color" content="#f5f1e8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TOEIC">
<style>
:root{
  --ink:#13233f; --ink2:#34445f; --muted:#76829a; --paper:#f5f1e8; --card:#fffdf9; --line:#e5ded0;
  --accent:#f2a541; --accent-ink:#5a3600; --ok:#1f9e89; --ok-bg:#e3f4ef; --bad:#d9533f; --bad-bg:#fbe7e3;
  --r:18px; --shadow:0 1px 2px rgba(19,35,63,.06),0 6px 18px rgba(19,35,63,.06);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
#app{max-width:620px;margin:0 auto;padding:0 16px calc(96px + var(--safe-b))}
.quiz-mode #app{padding-bottom:calc(24px + var(--safe-b))}

/* top bar */
.top{position:sticky;top:0;z-index:20;margin:0 -16px 14px;padding:calc(10px + var(--safe-t)) 16px 10px;background:rgba(245,241,232,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;border-bottom:1px solid transparent}
.top.scrolled{border-color:var(--line)}
.top h2{margin:0;font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);flex:none}
.icon-btn svg{width:20px;height:20px}
.brand{display:flex;align-items:center;gap:10px;flex:1}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--ink);display:grid;place-items:center}
.brand-mark svg{width:20px;height:20px}
.brand b{font-size:17px;letter-spacing:-.01em}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:-2px}
.streak{display:flex;align-items:center;gap:4px;font-weight:700;font-size:14px;background:var(--card);padding:7px 11px;border-radius:12px;box-shadow:var(--shadow)}

/* hero */
.hero{background:var(--ink);color:#fff;border-radius:24px;padding:20px;position:relative;overflow:hidden;margin-bottom:16px}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(242,165,65,.35),transparent 70%)}
.hero-top{display:flex;gap:14px;align-items:center;justify-content:space-between;position:relative;z-index:1}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#f8c77e;font-weight:700}
.hero h1{margin:4px 0 2px;font-size:23px;line-height:1.2;letter-spacing:-.02em}
.hero p{margin:0;color:#b9c3d6;font-size:14px}
.ring{--p:0;width:78px;height:78px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*360deg),rgba(255,255,255,.12) 0)}
.ring b{width:62px;height:62px;border-radius:50%;background:var(--ink);display:grid;place-items:center;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 16px;position:relative;z-index:1}
.stats div{background:rgba(255,255,255,.07);border-radius:12px;padding:9px 6px;text-align:center}
.stats b{display:block;font-size:16px}
.stats span{display:block;font-size:10.5px;color:#a9b4c9;line-height:1.25;margin-top:2px}
.hero .btn{position:relative;z-index:1}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:14px;font-weight:700;font-size:16px;background:var(--card);box-shadow:var(--shadow);transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px rgba(242,165,65,.35)}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:transparent;box-shadow:none;border:1.5px solid var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}
.btn.sm{padding:9px 12px;font-size:14px;border-radius:11px;width:auto}

/* section titles */
.sec-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 4px 10px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:17px}
.muted{color:var(--muted)}
.small{font-size:13.5px}

/* placement */
.placement{display:flex;gap:12px;align-items:center;border:1.5px dashed #d8cdb7;background:#fbf7ef;box-shadow:none}
.placement .pi{width:44px;height:44px;border-radius:12px;background:#fde9c8;display:grid;place-items:center;flex:none;font-size:22px}
.placement b{display:block}

/* ladder */
.ladder{position:relative}
.ladder:before{content:"";position:absolute;left:31px;top:30px;bottom:30px;width:3px;background:repeating-linear-gradient(var(--line) 0 6px,transparent 6px 11px);border-radius:3px}
.lv{position:relative;display:flex;gap:14px;align-items:stretch;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px;cursor:pointer}
.lv-badge{width:36px;height:36px;border-radius:12px;background:var(--c);color:#fff;font-weight:800;display:grid;place-items:center;flex:none;margin-top:2px;box-shadow:0 0 0 5px var(--paper)}
.lv-badge svg{width:18px;height:18px}
.lv.locked{background:#f0ebe1;box-shadow:none}
.lv.locked .lv-badge{background:#c9c1b2}
.lv.locked .lv-title,.lv.locked .lv-meta{color:#9a917f}
.lv.current{outline:2.5px solid var(--c);outline-offset:-2.5px}
.lv-body{flex:1;min-width:0}
.lv-title{font-weight:800;font-size:16.5px;letter-spacing:-.01em}
.lv-title small{font-weight:600;color:var(--muted);font-size:12.5px;margin-left:4px}
.lv-meta{font-size:13px;color:var(--muted);margin:1px 0 9px}
.bar{height:7px;border-radius:7px;background:#ece5d8;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:7px;transition:width .4s}
.lv-foot{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-top:7px;color:var(--ink2);gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:#efe9dd;color:var(--ink2);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:#11705f}
.chip.bad{background:var(--bad-bg);color:#a3392a}
.chip.go{background:#fde9c8;color:var(--accent-ink)}

/* level page */
.lv-hero{border-radius:24px;padding:20px;color:#fff;background:var(--c);margin-bottom:6px;position:relative;overflow:hidden}
.lv-hero:after{content:"";position:absolute;inset:auto -40px -80px auto;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12)}
.lv-hero .eyebrow{color:rgba(255,255,255,.8)}
.lv-hero h1{margin:4px 0;font-size:24px;letter-spacing:-.02em}
.lv-hero p{margin:6px 0 0;font-size:14px;opacity:.92;position:relative;z-index:1}
.unit{display:flex;gap:12px;align-items:center;cursor:pointer}
.unit-num{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:#efe9dd;flex:none}
.unit.done .unit-num{background:var(--ok);color:#fff}
.unit-body{flex:1;min-width:0}
.unit-body b{display:block;font-size:15.5px}
.unit-body span{font-size:13px;color:var(--muted)}
.chev{color:#b8ae9b;font-size:22px;line-height:1}
.test-card{border:2px solid var(--c);background:#fff}
.test-card .req{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:6px 0}
.test-card .req i{font-style:normal;width:20px;flex:none;text-align:center}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:#ebe4d6;border-radius:14px;padding:4px;margin-bottom:14px;position:sticky;top:calc(60px + var(--safe-t));z-index:10}
.tabs button{padding:9px 4px;border-radius:11px;font-weight:700;font-size:14px;color:var(--ink2)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* grammar */
.g-title{font-size:19px;margin:0 0 10px;letter-spacing:-.01em}
.rules{margin:0;padding:0;list-style:none;counter-reset:r}
.rules li{position:relative;padding:0 0 12px 34px;counter-increment:r}
.rules li:before{content:counter(r);position:absolute;left:0;top:1px;width:23px;height:23px;border-radius:8px;background:var(--ink);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
.rules b{color:#0e5d8f}
.ex{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex .en{font-weight:600}
.ex .vi{font-size:14px;color:var(--muted)}
.say{width:34px;height:34px;border-radius:10px;background:#eef3fb;color:#2f63b8;display:grid;place-items:center;flex:none}
.say svg{width:17px;height:17px}
.tip{background:#fff6e6;border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px;font-size:14.5px}
.tip b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#9a6200;margin-bottom:2px}

/* vocab */
.word{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.word:first-child{border-top:0;padding-top:2px}
.word-main{flex:1;min-width:0}
.word-main .w{font-weight:800;font-size:16.5px}
.word-main .ipa{color:var(--muted);font-size:13.5px;margin-left:4px}
.word-main .pos{font-size:11.5px;font-weight:700;color:#7a5bc2;background:#f0ebfb;border-radius:6px;padding:1px 6px;margin-left:4px}
.word-main .mean{font-size:14.5px;margin-top:2px}
.word-main .exs{font-size:13.5px;color:var(--ink2);font-style:italic;margin-top:2px}
.star{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#f3efe6;color:#b8ae9b;flex:none}
.star.on{background:#fde9c8;color:#d38200}
.star svg{width:18px;height:18px}

/* flashcard */
.fc-wrap{perspective:1200px;margin:6px 0 14px}
.fc{position:relative;height:300px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--ink);color:#fff}
.fc-face .w{font-size:32px;font-weight:800;letter-spacing:-.02em}
.fc-face .ipa{color:var(--muted);margin-top:4px}
.fc-back .mean{font-size:22px;font-weight:700}
.fc-back .exs{color:#b9c3d6;font-style:italic;margin-top:10px}
.fc-hint{position:absolute;bottom:14px;font-size:12px;color:var(--muted)}
.fc-count{text-align:center;font-weight:700;color:var(--muted);font-size:14px}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.qtop .title{flex:1;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font-variant-numeric:tabular-nums;font-weight:800;background:var(--ink);color:#fff;border-radius:10px;padding:6px 10px;font-size:14px}
.timer.low{background:var(--bad)}
.qprog{height:6px;border-radius:6px;background:#e6dfd1;overflow:hidden;margin-bottom:12px}
.qprog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.dots button{width:30px;height:30px;border-radius:9px;background:#ebe4d6;font-size:12.5px;font-weight:700;color:var(--ink2)}
.dots button.ans{background:#cfd8e8;color:var(--ink)}
.dots button.cur{outline:2px solid var(--ink);outline-offset:1px}
.tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.04em;color:#0e5d8f;background:#e4eef9;border-radius:8px;padding:3px 9px;margin-bottom:10px}
.audio{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;margin-bottom:12px}
.play{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.play svg{width:20px;height:20px}
.play.on{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,165,65,.6)}100%{box-shadow:0 0 0 14px rgba(242,165,65,0)}}
.audio b{display:block;font-size:15px}
.audio span{font-size:12.5px;color:#b9c3d6}
.passage{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;font-size:14.5px;line-height:1.6;margin-bottom:12px;max-height:46vh;overflow:auto;font-family:Georgia,"Times New Roman",serif}
.blank{display:inline-block;min-width:44px;border-bottom:2px solid var(--accent);color:#9a6200;font-weight:700;font-family:-apple-system,sans-serif;text-align:center}
.qtext{font-size:18px;font-weight:600;line-height:1.45;margin:2px 0 14px}
.opts{display:grid;gap:9px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);border:2px solid transparent;font-size:15.5px;line-height:1.35}
.opt .k{width:28px;height:28px;border-radius:9px;background:#efe9dd;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.opt.sel{border-color:var(--ink)}
.opt.sel .k{background:var(--ink);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:14px;border-radius:16px;padding:14px 16px;font-size:14.5px}
.fb.ok{background:var(--ok-bg)}
.fb.no{background:var(--bad-bg)}
.fb h4{margin:0 0 4px;font-size:15.5px}
.tr{margin-top:10px;padding-top:10px;border-top:1px dashed rgba(0,0,0,.15);font-size:13.5px;color:var(--ink2)}
.qnav{display:flex;gap:10px;margin-top:16px}
.qnav .btn{flex:1}

/* result */
.res{text-align:center;padding:24px 18px}
.big-ring{--p:0;--c:var(--ok);width:150px;height:150px;border-radius:50%;margin:4px auto 14px;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*360deg),#ebe4d6 0)}
.big-ring div{width:122px;height:122px;border-radius:50%;background:var(--card);display:grid;place-items:center;align-content:center}
.big-ring b{font-size:34px;letter-spacing:-.03em;line-height:1}
.big-ring span{font-size:13px;color:var(--muted)}
.res h2{margin:0 0 6px;font-size:23px}
.res p{margin:0 0 4px;color:var(--ink2)}
.unlock{background:linear-gradient(135deg,#fff3dc,#fde3b5);border-radius:16px;padding:14px;margin:14px 0 4px;font-weight:700;color:var(--accent-ink)}
.rv{border-left:4px solid var(--ok)}
.rv.no{border-left-color:var(--bad)}
.rv .q{font-weight:600;margin-bottom:6px}
.rv .a{font-size:14px;margin:2px 0}
.rv details{margin-top:8px;font-size:13.5px;color:var(--ink2)}
.rv summary{cursor:pointer;color:#0e5d8f;font-weight:600}
.pl-table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.pl-table td{padding:7px 4px;border-top:1px solid var(--line)}

/* cert */
.cert{background:radial-gradient(circle at 20% 0,#fff8ea,#fbeacb);border:2px solid #e3b866;border-radius:22px;padding:22px;text-align:center;margin-bottom:16px}
.cert .seal{font-size:40px}
.cert h2{margin:6px 0 4px;font-family:Georgia,serif;font-size:24px}

/* settings */
.set-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.set-row:first-child{border-top:0;padding-top:0}
.set-row .lbl{flex:1}
.set-row .lbl b{display:block;font-size:15px}
.set-row .lbl span{font-size:13px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--ink)}

/* tabbar */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,253,249,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + var(--safe-b))}
#tabbar .in{display:flex;max-width:620px;width:100%}
#tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;font-size:11.5px;font-weight:700;color:#9a917f;position:relative}
#tabbar a svg{width:23px;height:23px}
#tabbar a.on{color:var(--ink)}
#tabbar .badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:0 5px;min-width:17px;height:17px;line-height:17px;text-align:center}
.quiz-mode #tabbar{display:none}

/* toast & modal */
#toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.modal-bg{position:fixed;inset:0;background:rgba(19,35,63,.45);z-index:70;display:grid;place-items:center;padding:20px}
.modal{background:var(--card);border-radius:20px;padding:20px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal p{margin:0 0 16px;font-size:15.5px}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:80;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty .e{font-size:44px}
@media (min-width:700px){ .qtext{font-size:19px} .fc{height:340px} }

/* luyện đề */
.photo{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;min-height:150px;font-size:58px;line-height:1.1;background:linear-gradient(180deg,#eef3fb,#fffdf9);border:1.5px solid var(--line);border-radius:18px;margin-bottom:12px;padding:16px}
.photo.sm{min-height:0;font-size:30px;padding:8px;justify-content:flex-start;background:none;border:0;margin:0}
.opt .lo{color:var(--muted);font-style:italic}
.score-hero{background:var(--ink);color:#fff;border-radius:24px;padding:20px;margin-bottom:14px}
.score-hero .eyebrow{color:#f8c77e}
.score-big{display:flex;align-items:flex-end;gap:14px;margin:6px 0 14px;flex-wrap:wrap}
.score-big b{font-size:52px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.score-big span{color:#b9c3d6;font-size:14px;padding-bottom:6px}
.lr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lr div{background:rgba(255,255,255,.08);border-radius:14px;padding:10px 12px}
.lr small{display:block;color:#a9b4c9;font-size:12px}
.lr b{font-size:22px;font-variant-numeric:tabular-nums}
.lr i{display:block;height:6px;border-radius:6px;background:rgba(255,255,255,.14);margin-top:6px;overflow:hidden}
.lr i:after{content:"";display:block;height:100%;width:var(--w);background:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#ebe4d6;border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{padding:9px 2px;border-radius:11px;font-weight:700;font-size:13px;color:var(--ink2);line-height:1.2}
.seg button small{display:block;font-weight:600;font-size:11px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.mock{display:flex;gap:12px;align-items:center;cursor:pointer}
.mock .mi{width:48px;height:48px;border-radius:14px;background:#fde9c8;display:grid;place-items:center;font-weight:800;color:var(--accent-ink);flex:none;font-size:15px}
.mock.big{border:2px solid var(--accent)}
.parts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pt{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;text-align:left;display:flex;flex-direction:column;gap:3px}
.pt .pn{font-size:12px;font-weight:800;color:#0e5d8f;letter-spacing:.04em}
.pt b{font-size:15.5px;line-height:1.25}
.pt span{font-size:12.5px;color:var(--muted);line-height:1.35}
.pt .bar{margin-top:6px}
.pt.wide{grid-column:1/-1}
.fmt{width:100%;border-collapse:collapse;font-size:14px}
.fmt th,.fmt td{padding:7px 6px;border-top:1px solid var(--line);text-align:left}
.fmt th{font-size:12px;color:var(--muted);font-weight:700;border-top:0}
.fmt td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hist td{font-variant-numeric:tabular-nums}
@media (max-width:380px){ .parts{grid-template-columns:1fr} .seg button{font-size:12px} }

    if (m) {
      h += '<div class="score-big"><b>' + (m.ls + m.rs) + '</b><span>/ 990 · ' + esc(m.d) + '</span></div>' +
        '<div class="lr"><div><small>Nghe (Listening)</small><b>' + m.ls + '</b><i style="--w:' + (m.ls / 495 * 100) + '%"></i></div><div><small>Đọc (Reading)</small><b>' + m.rs + '</b><i style="--w:' + (m.rs / 495 * 100) + '%"></i></div></div>';
    } else h += '<div class="score-big"><b>—</b><span>Làm một đề thi thử bên dưới để có điểm ước tính</span></div>';
    h += '</section>';
    h += '<div class="sec-title">Độ khó</div><div class="seg">' + Object.keys(FILT).map(function (k) { return '<button class="' + (S.pf === k ? 'on' : '') + '" data-act="pf" data-k="' + k + '">' + FILT[k][2] + '<small>' + FILT[k][3] + '</small></button>'; }).join('') + '</div>';
    h += '<div class="sec-title">Thi thử có giờ, nghe 1 lần như thi thật</div>';
    Object.keys(MOCKS).forEach(function (k, i) { var M = MOCKS[k];
      h += '<div class="card mock ' + (i ? '' : 'big') + '" data-act="mock" data-k="' + k + '" role="button"><div class="mi">' + (i ? '20' : '50') + '</div><div style="flex:1"><b>' + M.t + ' · ' + M.n + '</b><div class="muted small">Đủ ' + (k === 'full' ? '7' : '6') + ' Part theo đúng thứ tự đề thật, chấm điểm Nghe / Đọc riêng</div></div><div class="chev">›</div></div>'; });
    h += '<div class="sec-title">Luyện từng Part · có giải thích từng câu</div><div class="parts">';
    ['1', '2', '3', '4', '5', '6', '7'].forEach(function (p) {
      var I = PINFO[p], n = groupsOf(p).reduce(function (a, g) { return a + g.length; }, 0), st = (S.ps || {})[p];
      h += '<button class="pt' + (p === '7' ? ' wide' : '') + '" data-act="part" data-p="' + p + '"><span class="pn">PART ' + p + (+p <= 4 ? ' · NGHE' : ' · ĐỌC') + '</span><b>' + I[0] + '</b><span>' + I[1] + '</span>' +
        '<span>' + n + ' câu trong ngân hàng · ' + (st && st.a ? 'đúng ' + pct(st.c / st.a) + ' (' + st.a + ' câu)' : 'chưa luyện') + '</span>' +
        '<div class="bar"><i style="width:' + (st && st.a ? st.c / st.a * 100 : 0) + '%"></i></div></button>';
    });
    h += '</div>';
    if (S.mocks && S.mocks.length) {
      h += '<div class="sec-title">Lịch sử thi thử</div><div class="card"><table class="fmt hist"><tr><th>Ngày</th><th>Đề</th><th style="text-align:right">Nghe</th><th style="text-align:right">Đọc</th><th style="text-align:right">Tổng</th></tr>' +
        S.mocks.slice(-6).reverse().map(function (x) { return '<tr><td>' + esc(x.d) + '</td><td>' + (MOCKS[x.k] ? MOCKS[x.k].t : '') + ' · ' + (FILT[x.f] ? FILT[x.f][2] : '') + '</td><td class="n">' + x.ls + '</td><td class="n">' + x.rs + '</td><td class="n"><b>' + (x.ls + x.rs) + '</b></td></tr>'; }).join('') + '</table></div>';
    }
    h += '<div class="sec-title">Cấu trúc đề TOEIC Listening & Reading thật</div><div class="card"><table class="fmt"><tr><th>Part</th><th>Nội dung</th><th style="text-align:right">Số câu</th></tr>' +
      ['1', '2', '3', '4', '5', '6', '7'].map(function (p) { return '<tr><td>' + p + '</td><td>' + PINFO[p][0] + '</td><td class="n">' + PINFO[p][2] + '</td></tr>'; }).join('') +
      '</table><p class="small muted" style="margin:10px 0 0">Nghe: 100 câu, khoảng 45 phút, mỗi bài chỉ phát một lần. Đọc: 100 câu trong 75 phút. Mỗi phần 5–495 điểm, tổng 10–990.</p></div>';
    return h;
  }

  /* ---------- màn hình: sổ lỗi sai ---------- */
  function vReview() {
    var ids = Object.keys(S.wrong).filter(function (id) { return QI[id]; });
    var h = topBar('Sổ lỗi sai', '');
    if (!ids.length) return h + '<div class="empty"><div class="e">📒</div><h3>Chưa có lỗi sai nào</h3><p>Câu nào bạn trả lời sai sẽ được lưu ở đây để ôn lại. Trả lời đúng khi ôn sẽ tự gỡ khỏi sổ.</p></div>';
    h += '<div class="card"><h3>' + ids.length + ' câu cần ôn</h3><p class="muted small" style="margin:0 0 12px">Ôn tối đa 10 câu mỗi lượt, có giải thích ngay. Trả lời đúng → câu được gỡ khỏi sổ.</p><button class="btn primary" data-act="reviewStart">Ôn ' + Math.min(10, ids.length) + ' câu ngay</button></div>';
    h += '<div class="sec-title">Danh sách</div>';
    ids.sort().forEach(function (id) { h += reviewCard(QI[id], undefined, false); });
    return h;
  }

  /* ---------- màn hình: cài đặt ---------- */
  function vSettings() {
    var h = topBar('Cài đặt', '');
    h += '<div class="card"><div class="set-row" style="display:block"><div class="lbl"><b>Tốc độ đọc: <span id="rateV">' + S.rate.toFixed(2) + '×</span></b><span>Chậm hơn giúp luyện nghe dễ hơn ở các bậc đầu</span></div>' +
      '<input type="range" id="rate" min="0.6" max="1.2" step="0.05" value="' + S.rate + '"></div>' +
      '<div class="set-row"><div class="lbl"><b>Thử giọng đọc</b><span>' + (voices.length ? voices.length + ' giọng tiếng Anh trên máy' : 'Đang tải giọng đọc…') + '</span></div><button class="btn sm" data-act="say" data-t="M: Good morning. Is the report ready? W: Yes, I sent it to you an hour ago.">▶ Nghe thử</button></div></div>';
    h += '<div class="card"><div class="set-row"><div class="lbl"><b>Sao lưu tiến độ</b><span>Tải file .json để chuyển sang máy khác</span></div><button class="btn sm" data-act="export">Tải về</button></div>' +
      '<div class="set-row"><div class="lbl"><b>Khôi phục tiến độ</b><span>Chọn file sao lưu đã tải trước đó</span></div><label class="btn sm" style="cursor:pointer">Chọn file<input type="file" id="importF" accept=".json,application/json" hidden></label></div>' +
      '<div class="set-row"><div class="lbl"><b>Làm lại bài xếp lớp</b><span>Chỉ mở thêm bậc, không xóa kết quả cũ</span></div><button class="btn sm" data-act="placement">Làm</button></div>' +
      '<div class="set-row"><div class="lbl"><b style="color:var(--bad)">Xóa toàn bộ tiến độ</b><span>Khóa lại các bậc và bắt đầu từ đầu</span></div><button class="btn sm" data-act="reset">Xóa</button></div></div>';
    h += '<div class="card small muted"><b style="color:var(--ink)">Quy tắc lên bậc</b><br>• Mỗi bậc có 4 bài: Ngữ pháp → Từ vựng → Luyện tập.<br>• Luyện tập đạt ≥60% thì bài được tính là hoàn thành.<br>• Xong 4 bài thì mở bài kiểm tra 15 câu / 15 phút, phần nghe chỉ được nghe tối đa 2 lần.<br>• Đạt ≥70% mới mở khóa bậc tiếp theo.<br>• Tiến độ lưu ngay trên máy này và vẫn dùng được khi không có mạng.<br><br><b style="color:var(--ink)">Luyện đề</b><br>• Luyện riêng từng Part 1–7, chọn độ khó theo bậc, có giải thích sau mỗi câu.<br>• Đề thi thử có giờ, nghe một lần như thi thật, Part 1–2 không in đáp án; kết quả cho điểm Nghe / Đọc ước tính.</div>';
    return h;
  }

  /* ---------- sự kiện ---------- */
  var ACT = {
    go: function (b) { go(b.dataset.h); },
    level: function (b) { var n = +b.dataset.n; if (!unlocked(n)) return toast('🔒 Cần đạt ≥70% bài kiểm tra Bậc ' + (n - 1) + ' để mở Bậc ' + n); go('#level-' + n); },
    unit: function (b) { FC = null; go('#unit-' + b.dataset.n + '-' + b.dataset.u + '-grammar'); },
    say: function (b) { speak(b.dataset.t, b.classList.contains('say') || b.classList.contains('play') ? b : null); },
    known: function (b) {
      var w = b.dataset.w; if (S.known[w]) delete S.known[w]; else S.known[w] = 1; touchDay(); save();
      b.classList.toggle('on', !!S.known[w]);
      var p = parts(), U = lv(+p[1]) && lv(+p[1]).units[+p[2] - 1], c = $('#knownCount');
      if (U && c) c.textContent = U.v.filter(function (x) { return S.known[x[0]]; }).length;
    },
    cards: function (b) { var n = +b.dataset.n, u = +b.dataset.u; FC = { n: n, u: u, i: 0, flip: false, list: shuffle(lv(n).units[u - 1].v) }; route(); },
    cardsRestart: function () { var U = lv(FC.n).units[FC.u - 1]; var l = U.v.filter(function (w) { return !S.known[w[0]]; }); FC.list = shuffle(l.length ? l : U.v); FC.i = 0; FC.flip = false; route(); },
    cardsClose: function () { FC = null; route(); },
    flip: function () { FC.flip = !FC.flip; var el = $('.fc'); if (el) el.classList.toggle('flip', FC.flip); },
    fcAns: function (b) { var w = FC.list[FC.i]; if (b.dataset.k === '1') S.known[w[0]] = 1; else delete S.known[w[0]]; touchDay(); save(); FC.i++; FC.flip = false; route(); },
    practice: function (b) { var n = +b.dataset.n, u = +b.dataset.u, U = lv(n).units[u - 1]; startQuiz({ mode: 'unit', n: n, u: u, title: 'Luyện tập · ' + U.t, questions: groupOrder(U.quiz, true, false) }); },
    test: function (b) { var n = +b.dataset.n; if (!testReady(n)) return toast('Hoàn thành 4 bài học trước nhé'); startQuiz({ mode: 'test', n: n, timed: true, title: 'Kiểm tra Bậc ' + n, questions: groupOrder(lv(n).test, true, true) }); },
    placement: function () {
      confirmBox('Bài xếp lớp gồm 24 câu (4 câu mỗi bậc), làm trong 24 phút. Bậc nào bạn đúng ≥3/4 câu (và đạt cả các bậc dưới) sẽ được mở khóa. Bắt đầu?', 'Bắt đầu', function () {
        var qs = []; LV.forEach(function (L) { var pool = []; L.units.forEach(function (U) { pool = pool.concat(U.quiz); }); qs = qs.concat(shuffle(pool).slice(0, PLACE_PER_LV)); });
        startQuiz({ mode: 'placement', timed: true, title: 'Bài xếp lớp', questions: qs });
      });
    },
    reviewStart: function () { var ids = shuffle(Object.keys(S.wrong).filter(function (id) { return QI[id]; })).slice(0, 10); startQuiz({ mode: 'review', title: 'Ôn lỗi sai', questions: ids.map(function (id) { return QI[id]; }) }); },
    pf: function (b) { S.pf = b.dataset.k; save(); route(); },
    part: function (b) {
      var p = b.dataset.p, qs = takeQ(p, 10, false);
      if (!qs.length) return toast('Chưa có câu Part ' + p + ' ở độ khó này, hãy chọn "Tất cả"');
      startQuiz({ mode: 'part', p: p, title: PART[p] + ' · ' + FILT[S.pf || 'all'][2], questions: qs });
    },
    mock: function (b) {
      var k = b.dataset.k, M = MOCKS[k], qs = [];
      M.plan.forEach(function (x) { qs = qs.concat(takeQ(x[0], x[1], !!x[2])); });
      confirmBox(M.t + ': <b>' + qs.length + ' câu</b>, ' + Math.round(M.secs / 60) + ' phút. Phần nghe chỉ phát <b>một lần</b> như thi thật, đáp án Part 1–2 không in ra. Làm xong sẽ có điểm ước tính. Bắt đầu?', 'Bắt đầu', function () {
        startQuiz({ mode: 'mock', k: k, timed: true, secs: M.secs, maxPlays: 1, title: M.t + ' · ' + FILT[S.pf || 'all'][2], questions: qs });
      });
    },
    pick: function (b) { pick(+b.dataset.pos); },
    play: function () { playAudio(); },
    next: function () { stopSpeech(); Q.i++; renderQuiz(); },
    prev: function () { stopSpeech(); Q.i--; renderQuiz(); },
    jump: function (b) { stopSpeech(); Q.i = +b.dataset.i; renderQuiz(); },
    submit: function () {
      if (!Q.timed) return finishQuiz();
      var blank = Q.items.filter(function (it) { return it.chosen === null; }).length;
      if (blank) confirmBox('Còn <b>' + blank + '</b> câu chưa trả lời. Vẫn nộp bài?', 'Nộp bài', finishQuiz); else finishQuiz();
    },
    quitQuiz: function () { confirmBox('Thoát bài đang làm? Kết quả bài này sẽ không được lưu.', 'Thoát', function () { clearInterval(timerId); stopSpeech(); var m = Q.mode, n = Q.n, u = Q.u; Q = null; history.replaceState(null, '', m === 'unit' ? '#unit-' + n + '-' + u + '-practice' : m === 'test' ? '#level-' + n : m === 'review' ? '#review' : (m === 'mock' || m === 'part') ? '#luyende' : location.pathname + location.search); route(); }); },
    export: function () {
      var name = 'bac-thang-toeic-' + today() + '.json', json = JSON.stringify(S, null, 1);
      if (DL) { DL.save({ filename: name, data: json }).then(function () { toast('Đã lưu file sao lưu'); }, function () { toast('Không lưu được file'); }); return; }
      var blob = new Blob([json], { type: 'application/json' }), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    },
    reset: function () { confirmBox('Xóa <b>toàn bộ</b> tiến độ, điểm số và sổ lỗi sai? Không thể hoàn tác.', 'Xóa hết', function () { S = def(); save(); toast('Đã xóa tiến độ'); go('#'); }); }
  };
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    var f = ACT[b.dataset.act]; if (f) { e.preventDefault(); f(b, e); }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'rate') { S.rate = +e.target.value; $('#rateV').textContent = S.rate.toFixed(2) + '×'; save(); }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id !== 'importF' || !e.target.files[0]) return;
    var fr = new FileReader();
    fr.onload = function () { try { var d = JSON.parse(fr.result); if (!d || typeof d.units !== 'object' || typeof d.tests !== 'object') throw 0; S = Object.assign(def(), d); save(); toast('Đã khôi phục tiến độ'); go('#'); } catch (err) { toast('File không hợp lệ'); } };
    fr.readAsText(e.target.files[0]);
  });
  document.addEventListener('keydown', function (e) {
    if (!Q || location.hash !== '#quiz' || $('#modal').innerHTML) return;
    var k = e.key.toUpperCase(), idx = 'ABCD'.indexOf(k); if (idx < 0) idx = '1234'.indexOf(k);
    if (idx >= 0 && idx < Q.items[Q.i].order.length) pick(idx);
    else if (e.key === 'Enter' || e.key === 'ArrowRight') { var nb = document.querySelector('[data-act=next],[data-act=submit].primary'); if (nb) nb.click(); }
    else if (e.key === 'ArrowLeft' && Q.timed && Q.i > 0) ACT.prev();
  });
  window.addEventListener('scroll', function () { var t = $('.top'); if (t) t.classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });

  // Khi mở trong trình xem của Claude: dùng tính năng tải file của Claude; trên GitHub Pages dùng tải file thường
  var DL = null;
  try { if (window.claude && window.claude.use) window.claude.use('downloads').then(function (d) { DL = d; }, function () {}); } catch (e) {}
  if ('serviceWorker' in navigator && location.protocol === 'https:') { navigator.serviceWorker.register('sw.js').catch(function () {}); }
  route();
})();

</script>
</body>
</html>
